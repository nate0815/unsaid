# PR：只跑測試與建置，當作合併前的檢查。
# 推到 main：測試、建置、部署到 GitHub Pages（https://nate0815.github.io/unsaid/）。
# dist/ 不進 git（AGENTS.md「護欄」），由這裡從原始碼建。
# Pages 的 Source 已設為「GitHub Actions」（2026-10-18）；換 repo 要重設。
name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 依分支分組：PR 的檢查不會把 main 正在跑的部署取消掉。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 測試沒過就不部署 —— 壞掉的版本不該被別人看到。
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # PR 只檢查不部署：Pages 只認 main，從 PR 部署會被環境保護規則擋下。
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
